[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisrag"
version = "1.0.0"
description = "Evidence-grounded EU AI governance copilot with hybrid RAG, risk screening and audit reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rushikesh Patil"}]
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
  "pydantic>=2.10,<3"
]

[project.optional-dependencies]
app = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "streamlit>=1.40,<2", "httpx>=0.27,<1", "pandas>=2.2,<3", "matplotlib>=3.9,<4"]
dense = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["aegisrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

